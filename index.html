<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活龙虾价格表 — Atlantic Chican Seafood</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header id="site-header">
    <div class="container">
      <div class="header-inner">

        <div class="header-top">
          <img src="assets/logo-placeholder.svg" alt="ACS" class="logo" width="48" height="48">
          <div>
            <div class="brand-name" id="brand-name">Atlantic Chican Seafood</div>
            <h1 class="page-title" id="page-title">活龙虾价格表</h1>
            <p class="page-subtitle" id="page-subtitle">当前价格参考</p>
          </div>
        </div>

        <p class="header-meta" id="last-updated"></p>

        <nav class="lang-switcher" aria-label="Language">
          <button class="lang-btn active" data-lang="zh-hans">简体中文</button>
          <span class="lang-divider" aria-hidden="true">|</span>
          <button class="lang-btn" data-lang="zh-hant">繁體中文</button>
          <span class="lang-divider" aria-hidden="true">|</span>
          <button class="lang-btn" data-lang="en">English</button>
        </nav>

      </div>
    </div>
  </header>

  <!-- ── Main ────────────────────────────────────────────────────────────── -->
  <main id="main-content" class="container">

    <!-- Shown while JSON is loading -->
    <p id="loading-msg" class="loading-msg">…</p>

    <!-- Shown if JSON fails to load -->
    <div id="error-msg" class="error-card"></div>

    <!-- All sections, hidden until JS renders them -->
    <div id="sections-wrapper" hidden>

      <!-- Announcement -->
      <section class="card">
        <h2 class="card-title" id="announcement-title"></h2>
        <p id="announcement-text"></p>
      </section>

      <!-- Price Table -->
      <section class="card">
        <h2 class="card-title" id="price-title"></h2>
        <div class="table-scroll">
          <table class="price-table">
            <thead>
              <tr>
                <th id="col-size"></th>
                <th id="col-cad"></th>
                <th id="col-usd"></th>
                <th id="col-rmb"></th>
                <th id="col-status"></th>
                <th id="col-note"></th>
              </tr>
            </thead>
            <tbody id="price-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- CNF Reference -->
      <section class="card">
        <h2 class="card-title" id="cnf-title"></h2>
        <div class="table-scroll">
          <table class="price-table">
            <thead>
              <tr>
                <th id="col-region"></th>
                <th id="col-addon"></th>
                <th id="col-cnf-note"></th>
              </tr>
            </thead>
            <tbody id="cnf-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- Contact -->
      <section class="card">
        <h2 class="card-title" id="contact-title"></h2>
        <div class="contact-list" id="contact-list"></div>
      </section>

      <!-- Disclaimer -->
      <section class="card disclaimer-card">
        <p id="disclaimer-text"></p>
      </section>

    </div><!-- #sections-wrapper -->

  </main>

  <footer id="site-footer">
    <p>© 2026 Atlantic Chican Seafood</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
