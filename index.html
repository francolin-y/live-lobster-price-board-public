<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Lobster Price Board</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fb;
      color: #1f2933;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 12px;
      padding: 28px;
    }

    .brand {
      color: #0b2f5b;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      color: #0b2f5b;
      font-size: 32px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #52606d;
      font-size: 16px;
    }

    .status {
      padding: 12px 14px;
      background: #eef6ff;
      border-left: 4px solid #0b2f5b;
      border-radius: 6px;
      font-size: 15px;
    }

    .meta {
      margin-top: 24px;
      color: #7b8794;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">Atlantic Chican Seafood</div>
      <h1>Live Lobster Price Board</h1>
      <p class="subtitle">Current price indication</p>

      <div class="status">
        Static deployment test page loaded successfully.
      </div>

      <p class="meta">
        If you can see this page, the subdomain and static hosting are working.
      </p>
    </section>
  </main>
</body>
</html>
